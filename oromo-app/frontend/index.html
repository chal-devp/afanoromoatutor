<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><title>Afaan Oromoo Tutor</title>
<style>
:root{--bg:#f7f5ef;--s:#fff;--t:#1d2a22;--m:#6a766e;--a:#1f7a4d;--at:#fff;--u:#e3f1e8;--b:#dcd8cc}
@media(prefers-color-scheme:dark){:root{--bg:#121814;--s:#1b241e;--t:#e8efe9;--m:#93a198;--a:#3fb37a;--at:#06210f;--u:#22382a;--b:#2c3a31}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font-family:system-ui,"Noto Sans Ethiopic",sans-serif;display:flex;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{display:flex;flex-direction:column;width:100%;max-width:640px;height:100%}
header{padding:12px 16px;border-bottom:1px solid var(--b)}h1{margin:0 0 8px;font-size:1.1rem}
.seg{display:inline-flex;border:1px solid var(--b);border-radius:10px;overflow:hidden;margin-right:8px}
.seg button{border:0;background:var(--s);color:var(--t);padding:7px 10px;font-size:.85rem}
.seg button[aria-pressed=true]{background:var(--a);color:var(--at)}
#log,#lessons,#practice,#account{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
#lessons,#practice,#account{display:none}
.msg{max-width:86%;padding:10px 13px;border-radius:14px;line-height:1.5;white-space:pre-wrap}
.bot{background:var(--s);border:1px solid var(--b);align-self:flex-start}.me{background:var(--u);align-self:flex-end}
.card{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:12px}
.card h3{margin:0 0 8px;font-size:1rem}.w{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--b)}
.w small{color:var(--m)}button.ghost{border:1px solid var(--b);background:none;color:var(--m);border-radius:8px;padding:3px 9px;font-size:.78rem}
footer{padding:10px 16px;border-top:1px solid var(--b);display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;border:1px solid var(--b);background:var(--s);color:var(--t);border-radius:12px;padding:10px;font:inherit}
.btn{border:0;border-radius:50%;width:46px;height:46px;background:var(--a);color:var(--at);font-size:1.1rem}.btn.rec{background:#c0392b;color:#fff}
.btn.send{border-radius:12px;width:auto;padding:0 14px;font-size:.9rem}
#note{font-size:.72rem;color:var(--m);padding:0 16px 6px;min-height:1em}
.opt{display:block;width:100%;text-align:left;margin:4px 0;padding:11px;border:1px solid var(--b);border-radius:10px;background:var(--s);color:var(--t);font:inherit}.opt.ok{background:#2e9e5e;color:#fff}.opt.no{background:#c0392b;color:#fff}.stat{font-size:.8rem;color:var(--m)}#account input{width:100%;padding:11px;margin:5px 0;border:1px solid var(--b);border-radius:10px;background:var(--s);color:var(--t);font:inherit}#account .btn2{padding:10px 14px;margin:4px 6px 4px 0;border:0;border-radius:10px;background:var(--a);color:var(--at);font:inherit}#account .btn2.alt{background:none;color:var(--t);border:1px solid var(--b)}</style></head><body><div id="app">
<header><h1>Afaan Oromoo Tutor · አስተማሪ</h1>
<div class="seg" id="tabs"><button data-t="chat" aria-pressed="true">Tutor</button><button data-t="lessons" aria-pressed="false">Lessons</button><button data-t="practice" aria-pressed="false">Practice</button><button data-t="account" aria-pressed="false">Account</button></div>
<div class="seg" id="langSeg"><button data-l="auto" aria-pressed="true">Auto</button><button data-l="am" aria-pressed="false">አማርኛ</button><button data-l="om" aria-pressed="false">Oromoo</button><button data-l="en" aria-pressed="false">English</button></div><div class="seg" id="modeSeg" style="margin-top:8px"><button data-m="tutor" aria-pressed="true">Tutor</button><button data-m="explain" aria-pressed="false">Explain sentence</button><button data-m="correct" aria-pressed="false">Correct me</button><button data-m="talk" aria-pressed="false">Talk</button></div></header>
<div id="log"><div class="msg bot">Akkam! ሰላም! Ask me anything about Afaan Oromoo, in Amharic, Oromo or English.</div></div>
<div id="lessons"></div><div id="practice"></div><div id="account"></div><div id="note"></div>
<footer id="foot"><button class="btn" id="mic" aria-label="Speak">🎤</button><textarea id="inp" rows="1" placeholder="Type or tap the mic…"></textarea><button class="btn send" id="send">Send</button></footer>
</div><script src="config.js"></script><script src="app.js"></script></body></html>
